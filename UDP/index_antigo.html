<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Visualização do Áudio</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; background: #fafafa; }
        canvas { width: 90%; max-width: 800px; height: 400px; margin-top: 20px; }
    </style>
</head>
<body>
    <h1>Visualização do Sinal</h1>
    <canvas id="grafico"></canvas>

    <script>
        const ctx = document.getElementById('grafico').getContext('2d');
        const chart = new Chart(ctx, {
            type: 'line',
            data: { labels: [], datasets: [{ label: 'Amplitude', data: [], borderColor: 'blue', borderWidth: 1, pointRadius: 0 }] },
            options: { scales: { x: { display: false }, y: { beginAtZero: true } } }
        });

        async function atualizarGrafico() {
            const resp = await fetch('/dados');
            const buffer = await resp.arrayBuffer();
            const view = new Int16Array(buffer);
            const novos = Array.from(view.slice(-512));  // últimos 512 pontos
            chart.data.labels = novos.map((_, i) => i);
            chart.data.datasets[0].data = novos;
            chart.update();
        }

        setInterval(atualizarGrafico, 500); // atualiza a cada 0.5s
    </script>
</body>
</html>
